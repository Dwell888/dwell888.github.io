<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirect Links</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  position: relative;
  height: 100vh;
  overflow: hidden;
}

/* Center video */
video {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-width: 80%;
  max-height: 80%;
  z-index: 1;
}

/* Link list */
ul {
  position: absolute;
  top: 50%;
  left: 40px;
  transform: translateY(-50%);
  z-index: 2;
  list-style: none;
  padding: 0;
  margin: 0;
  text-align: left;
}

li {
  margin-bottom: 10px;
}

a {
  font-size: 24px;
  text-decoration: none;
  color: #0077ff;
}

a:hover {
  text-decoration: underline;
}

/* Color tag boxes */
.tag {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-left: 6px;
  border-radius: 2px;
  position: relative;
  cursor: pointer;
}

.green { background: #2ecc71; }
.red { background: #e74c3c; }
.blue { background: #3498db; }

/* Tooltip styling */
.tag::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: 150%;
  left: 50%;
  transform: translateX(-50%);
  background: #222;
  color: white;
  font-size: 12px;
  padding: 4px 6px;
  border-radius: 4px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
}

.tag:hover::after {
  opacity: 1;
}

/* Version text */
.version {
  position: absolute;
  bottom: 8px;
  right: 10px;
  font-size: 12px;
  color: #888;
  z-index: 3;
}
</style>
</head>

<body>
