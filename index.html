<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TCG List Hub</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #111;
    color: white;
}

/* DECK GRID */
#list {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px;
    margin-top: 20px;
}

/* CARD */
.list-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #1e1e1e;
    padding: 14px;
    border-radius: 12px;
    font-size: 17px;
    text-align: center;
}

.list-card img {
    width: 100%;
    max-width: 220px; /* BIGGER */
    border-radius: 10px;
    margin-bottom: 10px;
}

/* HEADER */
header {
    padding: 20px;
    background: #1a1a1a;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

input {
    padding: 10px;
    width: 250px;
    font-size: 16px;
}

/* HOME GRID */
.container {
    padding: 25px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

/* RESPONSIVE */
@media (max-width: 1200px) {
    .container { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 800px) {
    .container { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 500px) {
    .container { grid-template-columns: repeat(1, 1fr); }
}

/* LIST CARD */
.card {
    background: #1e1e1e;
    padding: 15px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.03);
}

/* PREVIEW */
.preview {
    overflow: hidden;
    margin-top: 10px;
}

.carousel {
    display: flex;
    animation: scroll 18s linear infinite;
}

.preview img {
    height: 90px;
    margin-right: 10px;
    border-radius: 6px;
}

/* LIST VIEW */
.list-container {
    padding: 30px;
}

/* BUTTONS */
button {
    padding: 10px 14px;
    font-size: 15px;
    border: none;
    border-radius: 6px;
    background: #2a2a2a;
    color: white;
}

button:hover {
    background: #3a3a3a;
}

.tools {
    margin: 15px 0;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

@keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
}
</style>
</head>

<body>

<header>
    <div style="font-size:20px;">🃏 TCG List Hub</div>
    <input id="search" placeholder="Search name or author">
</header>

<div id="home" class="container"></div>

<script>

/* 🔥 IMAGE LOADER (HIGH → LOW RES) */
function getHighResImage(baseUrl) {
    const sizes = [1000, 800, 600, 400, 200];

    let index = 0;

    return new Promise(resolve => {
        function tryNext() {
            if (index >= sizes.length) return resolve(baseUrl);

            const url = baseUrl.replace(/_\d+x\d+/, `_${sizes[index]}x${sizes[index]}`);

            const img = new Image();
            img.onload = () => resolve(url);
            img.onerror = () => {
                index++;
                tryNext();
            };

            img.src = url;
        }

        tryNext();
    });
}

let lists = [
{
    title: "Electric Deck",
    author: "Player1",
    cards: [
        {
            name: "Manectric EX",
            set: "PHF",
            number: "113/119",
            image: "https://tcgplayer-cdn.tcgplayer.com/product/91526_in_400x400.jpg",
            link: "#",
            qty: 2
        },
        {
            name: "Stakataka GX",
            set: "CES",
            number: "102/168",
            image: "https://tcgplayer-cdn.tcgplayer.com/product/169884_in_400x400.jpg",
            link: "#",
            qty: 1
        }
    ]
}
];

let currentListData = null;
let editMode = false;

/* HOME */
function renderHome() {
    const home = document.getElementById("home");
    home.innerHTML = "";

    const query = document.getElementById("search").value.toLowerCase();

    lists
    .filter(l =>
        l.title.toLowerCase().includes(query) ||
        l.author.toLowerCase().includes(query)
    )
    .forEach((list, index) => {
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <h3>${list.title}</h3>
            <p>By ${list.author}</p>
            <div class="preview">
                <div class="carousel">
                    ${list.cards.concat(list.cards).map(c =>
                        `<img src="${c.image}">`
                    ).join("")}
                </div>
            </div>
        `;

        div.onclick = () => openList(index);
        home.appendChild(div);
    });
}

/* OPEN LIST */
function openList(index) {
    const list = lists[index];
    currentListData = list;

    document.getElementById("home").className = "list-container";

    document.getElementById("home").innerHTML = `
        <button onclick="resetHome()">⬅ Back</button>
        <h1>${list.title}</h1>
        <h3>By ${list.author}</h3>

        <div class="tools">
            <button onclick="exportMobile()">📱 Mobile Export</button>
            <button onclick="copyList()">📋 Copy List</button>
            <button onclick="toggleEdit()">✏️ Edit</button>
        </div>

        <div id="editPanel" style="display:none;">
            <input id="addLink" placeholder="Paste TCGPlayer link">
            <button onclick="addCardFromLink()">Add</button>
        </div>

        <div id="list"></div>
    `;

    renderCurrentList(list);
}

/* BACK */
function resetHome() {
    document.getElementById("home").className = "container";
    renderHome();
}

/* RENDER LIST */
async function renderCurrentList(list) {
    const container = document.getElementById("list");
    container.innerHTML = "";

    for (let i = 0; i < list.cards.length; i++) {
        const card = list.cards[i];

        const div = document.createElement("div");
        div.className = "list-card";

        const highRes = await getHighResImage(card.image);

        div.innerHTML = `
            <img src="${highRes}">
            <div>
                <b>${card.name}</b><br>
                [${card.set}] ${card.number}<br>
                Qty: ${card.qty || 1}
            </div>
        `;

        div.onclick = () => window.open(card.link);

        if (editMode) {
            const btn = document.createElement("button");
            btn.innerText = "Remove";
            btn.style.marginTop = "8px";

            btn.onclick = (e) => {
                e.stopPropagation();
                list.cards.splice(i, 1);
                renderCurrentList(list);
            };

            div.appendChild(btn);
        }

        container.appendChild(div);
    }
}

/* EDIT */
function toggleEdit() {
    editMode = !editMode;

    document.getElementById("editPanel").style.display =
        editMode ? "block" : "none";

    renderCurrentList(currentListData);
}

/* ADD */
function addCardFromLink() {
    const url = document.getElementById("addLink").value;

    const productId = url.match(/product\/(\d+)/)?.[1];
    if (!productId) return alert("Invalid link");

    const card = {
        name: "New Card",
        set: "UNK",
        number: "UNK",
        image: `https://tcgplayer-cdn.tcgplayer.com/product/${productId}_in_400x400.jpg`,
        link: url,
        qty: 1
    };

    currentListData.cards.push(card);
    renderCurrentList(currentListData);

    document.getElementById("addLink").value = "";
}

/* COPY */
function copyList() {
    const text = currentListData.cards.map(c =>
        `${c.qty || 1} ${c.name} [${c.set}] ${c.number}`
    ).join("\n");

    navigator.clipboard.writeText(text);
    alert("Copied!");
}

/* EXPORT */
function exportMobile() {
    const text = currentListData.cards.map(c =>
        `${c.qty || 1} ${c.name} [${c.set}] ${c.number}`
    ).join("\n");

    const blob = new Blob([text]);
    const url = URL.createObjectURL(blob);
    window.open(url);
}

/* SEARCH */
document.getElementById("search").addEventListener("input", renderHome);

renderHome();
</script>

</body>
</html>
