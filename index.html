<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirect Links</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  position: relative;
  height: 100vh;
  overflow: hidden;
}

/* Center video */
video {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-width: 80%;
  max-height: 80%;
  z-index: 1;
}

/* Links */
ul {
  position: absolute;
  top: 50%;
  left: 40px;
  transform: translateY(-50%);
  z-index: 2;
  list-style: none;
  padding: 0;
  margin: 0;
}

li {
  margin-bottom: 10px;
}

a {
  font-size: 24px;
  text-decoration: none;
  color: #0077ff;
}

a:hover {
  text-decoration: underline;
}

/* Color tags */
.tag {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-left: 6px;
  border-radius: 2px;
  position: relative;
  cursor: pointer;
}

.green { background:#2ecc71; }
.red { background:#e74c3c; }
.blue { background:#3498db; }

/* Tooltip */
.tag::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: 150%;
  left: 50%;
  transform: translateX(-50%);
  background: #222;
  color: white;
  font-size: 12px;
  padding: 4px 6px;
  border-radius: 4px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity .15s;
}

.tag:hover::after {
  opacity: 1;
}

/* Version text */
.version {
  position: absolute;
  bottom: 8px;
  right: 10px;
  font-size: 12px;
  color: #888;
}

/* Feedback box */
.feedback {
  position: absolute;
  right: 40px;
  top: 50%;
  transform: translateY(-50%);
  width: 250px;
  background: white;
  padding: 15px;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,0,0,.15);
  z-index: 3;
}

.feedback h3 {
  margin-top: 0;
  font-size: 18px;
}

.feedback textarea {
  width: 100%;
  height: 100px;
  resize: none;
  margin-bottom: 10px;
}

.feedback button {
  width: 100%;
  padding: 8px;
  border: none;
  background: #0077ff;
  color: white;
  cursor: pointer;
  border-radius: 4px;
}

.feedback button:hover {
  background: #005edb;
}

.status {
  font-size: 12px;
  margin-top: 6px;
  color: green;
}
</style>
</head>

<body>

<video id="randomVideo" autoplay loop muted playsinline>
<source id="videoSource" src="" type="video/mp4">
</video>

<ul>

<li>
<a href="https://www.flightreacts.xyz/MChtml5/">Minecraft</a>
<span class="tag green" data-tooltip="saving/easier progression soon"></span>
<span class="tag blue" data-tooltip="multiplayer soon"></span>
</li>

<li><a href="https://www.flightreacts.xyz/RETROBOWLhtml5/">Retro Bowl</a></li>
<li><a href="https://www.flightreacts.xyz/IQhtml5/">Impossible Quiz</a></li>
<li><a href="https://www.flightreacts.xyz/FNAFhtml5/">Five Nights At Freddys</a></li>
<li><a href="https://www.flightreacts.xyz/FNAF2html5/">Five Nights At Freddys 2</a></li>
<li><a href="https://www.flightreacts.xyz/FNAF3html5/">Five Nights At Freddys 3</a></li>
<li><a href="https://www.flightreacts.xyz/FNAF4html5/">Five Nights At Freddys 4</a></li>
<li><a href="https://www.flightreacts.xyz/BLOCKPOSThtml5/">BLOCKPOST</a></li>

<li>
<a href="https://www.flightreacts.xyz/btd4html5/">Bloons Tower Defense 4</a>
<span class="tag red" data-tooltip="to be removed"></span>
</li>

<li>
<a href="https://www.flightreacts.xyz/BTD5html5/">Bloons Tower Defense 5</a>
<span class="tag green" data-tooltip="saving/easier progression soon"></span>
</li>

<li><a href="https://www.flightreacts.xyz/SLOPEhtml5/">Slope</a></li>
<li><a href="https://www.flightreacts.xyz/BPhtml5/">Bad Piggies</a></li>

</ul>

<!-- Feedback -->
<div class="feedback">
<h3>Feedback</h3>
<textarea id="feedbackText" placeholder="Send game suggestions/feedback..."></textarea>
<button onclick="sendFeedback()">Send</button>
<div class="status" id="status"></div>
</div>

<div class="version">v1.18 3/10/26</div>

<script>

/* Discord webhook sender */
function sendFeedback() {

const text = document.getElementById("feedbackText").value;

if(!text){
document.getElementById("status").innerText = "Please enter game suggestions/feedback.";
return;
}

fetch("https://discord.com/api/webhooks/1480803226264535121/CkClRCM8CgBUvRp60QTuzXBQZLVtqPsx96OK1wvRC0bohxAgUVJJlNmFC9NSVWMvQEDR", {
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
content:"New Feedback/Game Suggestions:\n"+text
})
})
.then(()=>{
document.getElementById("status").innerText="Feedback sent!";
document.getElementById("feedbackText").value="";
})
.catch(()=>{
document.getElementById("status").innerText="Failed to send.";
});

}
</script>

</body>
</html>
