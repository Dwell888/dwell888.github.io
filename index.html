<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FlightReacts - 2.01</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: rgb(48, 46, 59); /* Your color */
        font-family: Arial, sans-serif;
    }

    .loading {
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: flex;
        gap: 6px;
    }

    .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: linear-gradient(135deg, #4facfe, #00c6ff);

        /* Glow effect */
        box-shadow:
            0 0 6px rgba(79, 172, 254, 0.6),
            0 0 12px rgba(0, 198, 255, 0.4);

        animation: bounce 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) {
        animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes bounce {
        0%, 80%, 100% {
            transform: scale(0);
            opacity: 0.5;
        }
        40% {
            transform: scale(1);
            opacity: 1;
        }
    }
</style>
</head>

<body>

<div class="loading">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

</body>
</html>
